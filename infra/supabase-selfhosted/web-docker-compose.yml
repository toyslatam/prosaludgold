name: prosaludgold-web

services:
  web:
    image: nginx:alpine
    container_name: prosaludgold-web
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.prosaludgold-web.rule: "Host(`prosaludgold.plataformapty.cloud`)"
      traefik.http.routers.prosaludgold-web.entrypoints: "websecure"
      traefik.http.routers.prosaludgold-web.tls: "true"
      traefik.http.routers.prosaludgold-web.tls.certresolver: "letsencrypt"
      traefik.http.services.prosaludgold-web.loadbalancer.server.port: "80"
