name: supabase-prosaludgold

services:
  studio:
    container_name: prosaludgold-studio
  api-gw:
    container_name: prosaludgold-gw
    # Solo accesible desde el propio host. Traefik lo alcanza por la red de
    # docker, no por este puerto. Importante: docker-proxy se salta ufw, asi
    # que publicar en 0.0.0.0 lo dejaria abierto a internet pese al firewall.
    ports: !override
      - 127.0.0.1:8040:8000/tcp
    labels:
      traefik.enable: "true"
      traefik.http.routers.prosaludgold-api.rule: "Host(`prosaludgold-api.plataformapty.cloud`)"
      traefik.http.routers.prosaludgold-api.entrypoints: "websecure"
      traefik.http.routers.prosaludgold-api.tls: "true"
      traefik.http.routers.prosaludgold-api.tls.certresolver: "letsencrypt"
      traefik.http.services.prosaludgold-api.loadbalancer.server.port: "8000"
  auth:
    container_name: prosaludgold-auth
  rest:
    container_name: prosaludgold-rest
  realtime:
    container_name: prosaludgold-realtime
  storage:
    container_name: prosaludgold-storage
  imgproxy:
    container_name: prosaludgold-imgproxy
  meta:
    container_name: prosaludgold-meta
  functions:
    container_name: prosaludgold-functions
  db:
    container_name: prosaludgold-db
    # Solo localhost: docker-proxy ignora ufw, publicar en 0.0.0.0 expondria
    # Postgres a internet. Para administrar: docker exec prosaludgold-db psql ...
    ports: !override
      - 127.0.0.1:5448:5432
  supavisor:
    container_name: prosaludgold-pooler
    ports: !override
      - 127.0.0.1:6548:6543
